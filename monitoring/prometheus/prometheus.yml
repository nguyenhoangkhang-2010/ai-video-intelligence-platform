# Minimal scrape configuration for the local/dev monitoring profile
# (docker compose --profile monitoring up). Targets use Compose
# service names (Prometheus runs inside the same Compose network).
#
# Two independent processes expose metrics, on different ports:
#   - the API (FastAPI): /metrics on port 8000
#   - Celery workers: a dedicated prometheus_client HTTP server on
#     port 9100 (default worker) / 9101 (optional GPU worker) - see
#     backend/app/workers/metrics.py for why this is a separate
#     exporter rather than reusing the API's /metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: celery-worker-cpu
    static_configs:
      - targets: ["celery:9100"]

  - job_name: celery-worker-gpu
    static_configs:
      - targets: ["celery-gpu:9101"]

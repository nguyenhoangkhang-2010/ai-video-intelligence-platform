name: Docker Build

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image-dev:
    name: Backend image (development Dockerfile)
    runs-on: ubuntu-latest

    # Real Postgres, not SQLite: the container's own entrypoint runs
    # `alembic upgrade head` on start (RUN_MIGRATIONS_ON_START
    # defaults true), and at least one existing migration
    # (cfa58af66763) uses an ALTER COLUMN TYPE that SQLite cannot
    # execute at all - this smoke test exercises the real migration
    # chain against the same engine dev/prod actually use, which a
    # SQLite-backed check could not do regardless of effort.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_video
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ai-video-backend:dev-ci
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      # Build-only proves the image compiles; it does not prove the
      # image actually boots, migrates, and serves a request - this
      # closes that gap. Isolated test configuration only: the
      # `postgres` service above is a throwaway container scoped to
      # this CI job, never a real/production database.
      - name: Smoke test - container boots, migrates, and serves /health
        run: |
          set -eu

          docker run -d --name backend-smoke \
            --network host \
            -e DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/ai_video" \
            -e SECRET_KEY="ci-smoke-test-secret-not-a-real-deployment-00" \
            -e CELERY_BROKER_URL="redis://localhost:6379/0" \
            -e CELERY_RESULT_BACKEND="redis://localhost:6379/0" \
            ai-video-backend:dev-ci

          echo "Waiting for the container to report healthy (bounded, 60s)..."
          healthy=false
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' backend-smoke 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              healthy=true
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Container never reported healthy (last status: $status)"
            docker logs backend-smoke || true
            exit 1
          fi

          echo "Container reported healthy - verifying /api/v1/health directly..."
          if ! curl -sf http://localhost:8000/api/v1/health; then
            echo "::error::GET /api/v1/health did not return success"
            docker logs backend-smoke || true
            exit 1
          fi
          echo
          echo "Smoke test passed."

      - name: Capture logs on failure
        if: failure()
        run: docker logs backend-smoke || true

      - name: Tear down smoke test container
        if: always()
        run: docker rm -f backend-smoke || true

  backend-image-prod:
    name: Backend image (production Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/backend.Dockerfile
          push: false
          tags: ai-video-backend:prod-ci
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

  frontend-image:
    name: Frontend image (production Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same rationale as .github/workflows/ci.yml: frontend/ now has a
      # real package.json/package-lock.json, so this always builds
      # today. The guard is kept as a defensive fallback - if either
      # file is ever missing, this skips gracefully instead of failing.
      - name: Detect buildable frontend
        id: detect
        working-directory: frontend
        run: |
          if [ -s package.json ] && [ -f package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ has no installable package.json/lockfile yet - skipping Docker build."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.ready == 'true'

      - uses: docker/build-push-action@v6
        if: steps.detect.outputs.ready == 'true'
        with:
          context: frontend
          file: deployment/docker/frontend.Dockerfile
          push: false
          tags: ai-video-frontend:prod-ci
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

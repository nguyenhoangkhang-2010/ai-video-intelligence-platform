# Builds and publishes versioned backend/frontend images to GitHub
# Container Registry (GHCR) when a "v*" tag is pushed, or on manual
# dispatch. Uses the built-in, always-available GITHUB_TOKEN - no
# externally-configured registry credential is required.
#
# This is the image-publishing half of a staging/production release.
# It deliberately does NOT deploy anywhere (no SSH/target host,
# no cloud provider) - the repository has no established deployment
# target for that yet (see deployment/docker/README.md). Wiring an
# actual deploy step here later only needs a target host/credentials
# to be added as repository secrets - the images this workflow
# publishes are already deployment-ready.
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publish-backend:
    name: Publish backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-frontend:
    name: Publish frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same graceful skip as docker.yml/ci.yml - see those files for
      # the rationale (frontend/ is currently an empty scaffold).
      - name: Detect buildable frontend
        id: detect
        working-directory: frontend
        run: |
          if [ -s package.json ] && [ -f package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ has no installable package.json/lockfile yet - skipping release image."
          fi

      - uses: docker/login-action@v3
        if: steps.detect.outputs.ready == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        if: steps.detect.outputs.ready == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend

      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.ready == 'true'

      - uses: docker/build-push-action@v6
        if: steps.detect.outputs.ready == 'true'
        with:
          context: frontend
          file: deployment/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

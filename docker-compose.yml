services:
  redis:
    image: redis:7-alpine
    container_name: ai-video-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-video-api
    restart: unless-stopped

    ports:
      - "8001:8000"

    env_file:
      - .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    volumes:
      - ./storage:/app/storage

    depends_on:
      - redis

  celery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-video-celery
    restart: unless-stopped

    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info

    env_file:
      - .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    volumes:
      - ./storage:/app/storage

    depends_on:
      - redis

volumes:
  redis_data:
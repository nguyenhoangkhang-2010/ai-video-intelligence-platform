<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelSense 3D UI kit</title>
<style>
  :root { --bg: #FAFAFC; --panel: #FFFFFF; --line: #E3E5EE; --text: #141622; --muted: #4B4F66; --accent: #3D52DB; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-columns: 240px 1fr; }
  nav { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px 12px; }
  nav h1 { font-size: 15px; margin: 0 0 12px 8px; }
  nav button { display: block; width: 100%; text-align: left; min-height: 40px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--text); font: 13px ui-monospace, monospace; cursor: pointer; }
  nav button[aria-current="true"] { background: rgb(61 82 219 / 0.1); color: var(--accent); }
  main { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #clips { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #clips button { min-height: 40px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 13px ui-monospace, monospace; cursor: pointer; }
  #clips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #info { position: absolute; top: 14px; left: 16px; font: 12px ui-monospace, monospace; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<nav><h1>ReelSense 3D UI</h1><div id="list"></div></nav>
<main><div id="info"></div><div id="clips"></div></main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const BASE = '../frontend/public/models/ui/';
const main = document.querySelector('main');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
main.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight('#ffffff', 1.4);
key.position.set(2, 3, 4);
scene.add(key);
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function resize() {
  const { clientWidth: w, clientHeight: h } = main;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const loader = new GLTFLoader();
let current, mixer, actions = {};
const manifest = await (await fetch(BASE + 'manifest.json')).json();

async function show(entry) {
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.file === entry.file)));
  if (current) scene.remove(current);
  const gltf = await loader.loadAsync(BASE + entry.file);
  current = gltf.scene;
  scene.add(current);
  mixer = new THREE.AnimationMixer(current);
  actions = Object.fromEntries(gltf.animations.map((c) => [c.name, mixer.clipAction(c)]));
  // Frame the model
  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size * 0.35, size * 0.25, size * 1.55));
  controls.update();
  document.getElementById('info').textContent = `${entry.file} · ${entry.tris.toLocaleString()} tris · ${entry.kb} KB`;
  const bar = document.getElementById('clips');
  bar.innerHTML = '';
  for (const name of Object.keys(actions)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = name;
    b.onclick = () => play(name, b);
    bar.appendChild(b);
  }
  const first = Object.keys(actions)[0];
  if (first) play(first, bar.firstChild);
}
function play(name, btn) {
  mixer.stopAllAction();
  const a = actions[name];
  const loop = /Idle|Float|Pulse|Thinking|Playback|Ripple|Scan|Process|AI_Live/.test(name);
  a.reset().setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce).play();
  a.clampWhenFinished = true;
  document.querySelectorAll('#clips button').forEach((b) => b.classList.toggle('on', b === btn));
}

const list = document.getElementById('list');
for (const entry of manifest) {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.file = entry.file;
  b.textContent = entry.file.replace(/^rs_|\.glb$/g, '');
  b.onclick = () => show(entry);
  list.appendChild(b);
}
const pick = new URLSearchParams(location.search).get('m');
await show(manifest.find((e) => e.file.includes(pick || 'video_frame')) || manifest[0]);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  mixer?.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
window.__kit = { show, manifest, play: (n) => play(n, null), actions: () => actions, mixer: () => mixer };
</script>
</body>
</html>

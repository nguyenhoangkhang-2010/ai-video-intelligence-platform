# Production/staging stack.
#
# Differences from the root docker-compose.yml (development):
#   - builds the hardened multi-stage images in deployment/docker/
#     instead of the simpler root ./Dockerfile
#   - no bind-mounted source code - only built images run
#   - debug mode forced off (ENVIRONMENT/DEBUG baked into the image)
#   - database/Redis ports are NOT published to the host
#   - nginx is the only public entrypoint (port 80)
#   - all state lives in named volumes
#
# Run from the repository root so relative build contexts resolve:
#   docker compose -f deployment/docker/docker-compose.prod.yml \
#     --env-file .env.production up -d --build
#
# .env.production is never committed - see .env.example for the
# variables it must define (this compose file reads the same names).
#
# This is a deployment FOUNDATION (Phase 12 scope): it does not
# include TLS termination, secrets-manager integration, autoscaling,
# or an actual target host/provider - see deployment/docker/README.md
# and Phase 13 for that.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["frontend"]

    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  storage_data:

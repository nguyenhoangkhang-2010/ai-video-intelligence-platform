# Production/staging stack.
#
# Differences from the root docker-compose.yml (development):
#   - builds the hardened multi-stage images in deployment/docker/
#     instead of the simpler root ./Dockerfile
#   - no bind-mounted source code - only built images run
#   - debug mode forced off (ENVIRONMENT/DEBUG baked into the image)
#   - database/Redis ports are NOT published to the host
#   - nginx is the only public entrypoint (port 80)
#   - all state lives in named volumes
#
# Run from the repository root so relative build contexts resolve:
#   docker compose -f deployment/docker/docker-compose.prod.yml \
#     --env-file .env.production up -d --build
#
# .env.production is never committed - see .env.example for the
# variables it must define (this compose file reads the same names).
#
# This is a deployment FOUNDATION: it does not include TLS
# termination, secrets-manager integration, autoscaling, Kubernetes,
# or an actual target host/provider - see deployment/docker/README.md
# and docs/deployment.md for what is and is not covered.
#
# Resource limits below are conservative starting points, not
# universally-correct values for every deployment - tune via the
# *_CPU_LIMIT/*_MEMORY_LIMIT environment variables (see .env.example)
# once you know this workload's actual behavior on your hardware.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-2}"
          memory: ${DB_MEMORY_LIMIT:-2g}

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1}"
          memory: ${REDIS_MEMORY_LIMIT:-512m}

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2}"
          memory: ${API_MEMORY_LIMIT:-2g}

  worker:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    # See docker-compose.yml (development) for why both queues are
    # consumed by default and how the optional "worker-gpu" service
    # below complements this one.
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - -Q
      - celery_cpu,celery_gpu
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
      # "api" is the single designated migrator (see
      # backend/scripts/docker-entrypoint.sh).
      RUN_MIGRATIONS_ON_START: "false"

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Same reasoning as the dev docker-compose.yml: the image's baked-in
    # Dockerfile HEALTHCHECK targets uvicorn's port 8000, which this
    # container never listens on - reuse the worker's own Prometheus
    # metrics server (app/workers/metrics.py) as the liveness signal
    # instead.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2}"
          memory: ${WORKER_MEMORY_LIMIT:-4g}

  # Not started unless the "gpu" profile is enabled - requires the
  # NVIDIA Container Toolkit on the host:
  #   docker compose -f deployment/docker/docker-compose.prod.yml \
  #     --profile gpu --env-file .env.production up -d --build
  worker-gpu:
    profiles: ["gpu"]

    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - -Q
      - celery_cpu,celery_gpu
      - --concurrency=${CELERY_GPU_WORKER_CONCURRENCY:-1}

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
      RUN_MIGRATIONS_ON_START: "false"
      WHISPER_DEVICE: cuda
      METRICS_WORKER_PORT: 9101

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  frontend:
    profiles: ["frontend"]

    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  storage_data:

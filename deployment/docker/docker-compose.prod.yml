# Production/staging stack.
#
# Differences from the root docker-compose.yml (development):
#   - builds the hardened multi-stage images in deployment/docker/
#     instead of the simpler root ./Dockerfile
#   - no bind-mounted source code - only built images run
#   - debug mode forced off (ENVIRONMENT/DEBUG baked into the image)
#   - database/Redis ports are NOT published to the host
#   - nginx is the only public entrypoint (port 80)
#   - all state lives in named volumes
#
# Run from the repository root so relative build contexts resolve:
#   docker compose -f deployment/docker/docker-compose.prod.yml \
#     --env-file .env.production up -d --build
#
# .env.production is never committed - see .env.example for the
# variables it must define (this compose file reads the same names).
#
# nginx terminates TLS using deployment/nginx/certs/{localhost.crt,
# localhost.key} (see deployment/nginx/nginx.conf and
# deployment/docker/README.md for how to generate/replace them - the
# key is never committed, see .gitignore). This is still a deployment
# FOUNDATION in every other respect: no secrets-manager integration,
# no autoscaling, no Kubernetes, no actual target host/provider - see
# deployment/docker/README.md and docs/deployment.md for what is and
# is not covered.
#
# Resource limits below are conservative starting points, not
# universally-correct values for every deployment - tune via the
# *_CPU_LIMIT/*_MEMORY_LIMIT environment variables (see .env.example)
# once you know this workload's actual behavior on your hardware.
#
# Explicit project name: without one, Compose defaults to the
# basename of the directory THIS FILE lives in ("docker"), not the
# repository name - found live, on this exact machine, colliding with
# an unrelated project whose own compose file also happens to live in
# a directory named "docker". Compose then treated that project's
# containers as this stack's "orphans" (visible in `docker compose
# ... ps -a` output alongside this stack's own services) and vice
# versa. An explicit name removes the ambiguity regardless of what
# directory the file happens to sit in on any given machine.
name: ai-video-intelligence-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-2}"
          memory: ${DB_MEMORY_LIMIT:-2g}

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1}"
          memory: ${REDIS_MEMORY_LIMIT:-512m}

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
      # Deliberately under the storage_data volume, NOT the image's
      # own default (~app/.cache/huggingface, outside any volume) -
      # found live: without this override, a genuinely large embedding
      # model download (BGE-M3, several GB) landed outside storage_data
      # entirely, so it would silently re-download in full on every
      # container recreation instead of persisting - same reasoning as
      # docker-compose.yml's (development) identical override.
      HF_HOME: /app/storage/.cache/huggingface

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2}"
          memory: ${API_MEMORY_LIMIT:-2g}

  worker:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    # See docker-compose.yml (development) for why both queues are
    # consumed by default and how the optional "worker-gpu" service
    # below complements this one.
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - -Q
      - celery_cpu,celery_gpu
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
      # "api" is the single designated migrator (see
      # backend/scripts/docker-entrypoint.sh).
      RUN_MIGRATIONS_ON_START: "false"
      # See the "api" service's HF_HOME comment above - same reasoning.
      HF_HOME: /app/storage/.cache/huggingface

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Same reasoning as the dev docker-compose.yml: the image's baked-in
    # Dockerfile HEALTHCHECK targets uvicorn's port 8000, which this
    # container never listens on - reuse the worker's own Prometheus
    # metrics server (app/workers/metrics.py) as the liveness signal
    # instead.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2}"
          memory: ${WORKER_MEMORY_LIMIT:-4g}

  # Not started unless the "gpu" profile is enabled - requires the
  # NVIDIA Container Toolkit on the host:
  #   docker compose -f deployment/docker/docker-compose.prod.yml \
  #     --profile gpu --env-file .env.production up -d --build
  worker-gpu:
    profiles: ["gpu"]

    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile

    restart: unless-stopped

    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - -Q
      - celery_cpu,celery_gpu
      - --concurrency=${CELERY_GPU_WORKER_CONCURRENCY:-1}

    env_file:
      - ../../.env.production

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
      RUN_MIGRATIONS_ON_START: "false"
      WHISPER_DEVICE: cuda
      METRICS_WORKER_PORT: 9101
      # See the "api" service's HF_HOME comment above - same reasoning.
      HF_HOME: /app/storage/.cache/huggingface

    volumes:
      - storage_data:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  frontend:
    profiles: ["frontend"]

    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - api
    # NOT depends_on: frontend - frontend is profile-gated ("frontend"
    # profile, see above) and nginx itself is not, so a plain
    # `docker compose up` (no --profile frontend, i.e. backend-only)
    # must still bring nginx up cleanly. When the frontend profile
    # isn't enabled, "/" simply 502s until it is - the existing,
    # documented behavior for this optional service.

volumes:
  postgres_data:
  redis_data:
  storage_data:

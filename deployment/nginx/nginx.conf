# Minimal reverse proxy for the production Compose stack
# (deployment/docker/docker-compose.prod.yml): a single public entry
# point (port 80) fronting the backend API and, once it exists, the
# frontend app. Talks to other containers by their Compose service
# name (api/frontend) - never localhost/127.0.0.1.
#
# Out of scope for Phase 12 (deliberately not included here): TLS
# termination/certificates, rate limiting, caching, and any other
# production-hardening concern - add those when a real target
# environment is chosen (Phase 13).

server {
    listen 80;
    server_name _;

    client_max_body_size 5000m;

    # Baseline security headers. TLS-specific headers (HSTS, etc.) are
    # deliberately not set here since this config does not terminate
    # TLS itself - add those once a real certificate/target domain is
    # configured (see deployment/docker/README.md).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # /metrics is intentionally NOT proxied here - it must never be
    # reachable from outside the deployment network. Scrape it
    # directly from Prometheus over the Compose-internal network
    # (see monitoring/prometheus/prometheus.yml), not through nginx.
    location /metrics {
        return 404;
    }

    # Backend API + docs.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Frontend app. Only reachable once the "frontend" profile is
    # enabled and the frontend has real, buildable application code
    # (see deployment/docker/frontend.Dockerfile) - until then this
    # location has nothing to proxy to.
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Reverse proxy for the production Compose stack
# (deployment/docker/docker-compose.prod.yml): a single public entry
# point (HTTPS, port 443; port 80 redirects to it) fronting the
# backend API and the frontend app. Talks to other containers by
# their Compose service name (api/frontend) - never localhost/127.0.0.1.
#
# TLS: terminates here using the cert/key in ./certs (see
# ./certs/.gitkeep and the root .gitignore - the key is never
# committed). For local/dev use, deployment/docker/README.md documents
# generating a self-signed pair with openssl; for a real public
# deployment, replace those two files with a CA-issued certificate
# (e.g. Let's Encrypt/certbot) and reload nginx - nothing else in this
# file needs to change.
#
# Still out of scope here (unchanged from before): rate limiting at
# the proxy layer and caching - the backend's own Redis-backed limiter
# (app/core/rate_limit.py) already covers rate limiting application-side.

server {
    listen 80;
    server_name _;

    # Every plain-HTTP request is redirected, not served - HTTPS is
    # the only supported entry point once TLS is configured (see the
    # server block below). $request_uri preserves path+query so a
    # bookmarked/shared http:// link still lands on the right page.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 5000m;

    # HSTS: the one security header that genuinely belongs here rather
    # than at the application layer, since it's meaningless without a
    # TLS-terminating hop to attach it to. max-age is intentionally
    # modest (1 day) rather than the commonly-recommended 1-2 years,
    # specifically because the shipped certificate is self-signed for
    # local/dev use - a long max-age on a cert clients don't yet trust
    # long-term would be the wrong default to hand out silently. Raise
    # this once a CA-issued certificate is in place for a real domain.
    #
    # X-Content-Type-Options/X-Frame-Options/Referrer-Policy/
    # Permissions-Policy are deliberately NOT repeated here - both
    # proxied apps already set them themselves (frontend/next.config.js,
    # backend app/middleware/security_headers.py). Found live (curl -D
    # against this exact stack): adding them again at this layer sent
    # every one of those four headers TWICE, which for X-Frame-Options
    # specifically is a real, documented footgun - some older user
    # agents treat a duplicate X-Frame-Options as invalid and silently
    # drop framing protection entirely, the opposite of what a
    # defense-in-depth second copy was meant to buy.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # /metrics is intentionally NOT proxied here - it must never be
    # reachable from outside the deployment network. Scrape it
    # directly from Prometheus over the Compose-internal network
    # (see monitoring/prometheus/prometheus.yml), not through nginx.
    location /metrics {
        return 404;
    }

    # Backend API + docs.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Frontend app.
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
